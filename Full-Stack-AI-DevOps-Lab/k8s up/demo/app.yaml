apiVersion: apps/v1
kind: Deployment
metadata:
  name: web

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: web
          image: nginx

          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: APP_MESSAGE

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web-service

spec:
  type: NodePort

  selector:
    app: web

  ports:
    - port: 80
      targetPort: 80
      nodePort: 31488
